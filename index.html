<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Boothify Smart AI Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--p:#D6338A;--s:#FCE4EF;--c:#FF8978;--t:#242424;--g:#F5F4F6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Lato,'Plus Jakarta Sans',system-ui,sans-serif;color:var(--t);background:#fff;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#fff 0 33px,#F5F4F6 33px 66px)}
.d{position:absolute;border-radius:50%;z-index:0}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;z-index:2;background:#fff;border-bottom:1px solid #eee;margin-bottom:8px}
.logo{font-weight:900;font-size:26px;letter-spacing:1px;color:#fff;-webkit-text-stroke:1.5px var(--t);text-shadow:2px 2px 0 var(--p)}.logo b{color:#fff}
#dots span{width:24px;height:6px;border-radius:9px;background:var(--s);display:inline-block;margin:0 3px;transition:.3s}#dots .on{background:var(--p)}
main{flex:1;overflow:auto;padding:4px 24px 22px;z-index:1;display:flex;flex-direction:column;align-items:center;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
h1{font-weight:800;font-size:clamp(28px,5vw,50px);margin:8px 0;text-align:center;line-height:1.05}h1{font-weight:900}h1 em{color:var(--p);font-style:normal;font-family:'Great Vibes',cursive;font-weight:400;font-size:1.45em;display:inline-block;text-transform:lowercase}h1 em::first-letter{text-transform:uppercase}
.sub{color:#666;text-align:center;margin:0 0 16px;font-size:18px}
.btn{border:0;border-radius:999px;padding:16px 34px;font:900 17px Lato,sans-serif;cursor:pointer;transition:.15s}
.btn.p{background:var(--p);color:#fff;box-shadow:0 10px 24px rgba(214,51,138,.35)}.btn.o{background:#fff;color:var(--p);border:1.5px solid var(--t)}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.45;pointer-events:none}.btn.big{font-size:22px;padding:22px 48px}
#back{background:var(--g);border:0;border-radius:999px;padding:10px 18px;font:700 15px inherit;cursor:pointer}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;width:100%;max-width:920px;margin-bottom:18px}
.card{background:#fff;border:3px solid var(--g);border-radius:26px;padding:16px;text-align:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.06);transition:.2s;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.card:hover{transform:translateY(-3px)}.card.sel{border-color:var(--p);background:var(--s)}.card b{font-size:16px}.card small{color:#777}
.card img{width:100%;border-radius:14px;aspect-ratio:4/3;object-fit:cover}
.strip{--w:120px;width:var(--w);background:var(--fc,#FCE4EF);padding:calc(var(--w)*.07);border-radius:10px;display:grid;gap:calc(var(--w)*.05);position:relative;box-shadow:0 8px 20px rgba(0,0,0,.16);font-size:calc(var(--w)*.08);flex:none}
.strip.grid{grid-template-columns:1fr 1fr}
.cell{aspect-ratio:4/3;background:linear-gradient(135deg,#fff,#f6c1dc);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--p);font-weight:800}
.strip.single .cell{aspect-ratio:3/4}.cell img{width:100%;height:100%;object-fit:cover}
.ft{grid-column:1/-1;text-align:center;font-weight:800;line-height:1.2;padding-top:2px}.ft img{max-height:calc(var(--w)*.15);display:block;margin:0 auto 2px}
.stk{position:absolute;font-size:calc(var(--w)*.2)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{border:0;border-radius:999px;padding:10px 22px;font:800 15px inherit;background:var(--g);cursor:pointer}.tab.on{background:var(--p);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g3 .card{padding:10px;font-size:13px}
.fld{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}.fld input[type=text],.fld input[type=date]{width:100%;padding:12px 16px;border:2px solid var(--g);border-radius:999px;font:600 16px inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{width:44px;height:44px;border-radius:50%;border:3px solid var(--g);background:#fff;font-size:22px;cursor:pointer}.chip.sel{border-color:var(--p)}
.vf{position:relative;width:min(100%,700px);aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:#000;border:6px solid var(--p);box-shadow:0 14px 40px rgba(214,51,138,.3)}
.vf>img,.vf>video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.vf video{transform:scaleX(-1)}
.guide{position:absolute;inset:10% 31%;border:3px dashed rgba(255,255,255,.85);border-radius:50%}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:170px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(214,51,138,.9)}
.fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.fl.on{animation:fl .4s}@keyframes fl{from{opacity:1}to{opacity:0}}
.bdg{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.pg{display:flex;gap:8px;margin:14px 0}.pg i{width:38px;height:12px;border-radius:9px;background:var(--g)}.pg i.on{background:var(--p)}
.ba{position:relative;width:min(100%,520px);aspect-ratio:4/3;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lb{position:absolute;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800}
.ld{position:absolute;inset:0;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:800;color:var(--p)}
.sp{width:54px;height:54px;border:6px solid var(--s);border-top-color:var(--p);border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.sw{position:relative;width:60px;height:32px;background:#ccc;border-radius:99px;cursor:pointer;transition:.2s;flex:none}.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--p)}.sw.on::after{left:32px}
.ft2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}.pill{background:var(--s);color:var(--p);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.note{font-size:12px;color:#888;text-align:center;max-width:460px;margin:6px 0}
.st{display:flex;align-items:center;gap:10px;font-weight:700;color:#aaa;margin:6px 0}.st.done{color:var(--t)}.st.act{color:var(--p)}.st i{width:22px;height:22px;border-radius:50%;background:var(--g);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff}.st.done i{background:#2fb36b}.st.act i{background:var(--p)}
</style></head><body><div id="app">
<div class="d" style="width:460px;height:460px;border:2px solid var(--p);right:-120px;top:90px"></div><div class="d" style="width:200px;height:200px;background:var(--c);left:-80px;bottom:-60px;opacity:.25"></div><div class="d" style="width:90px;height:90px;background:var(--p);left:8%;top:18%;opacity:.12"></div>
<header><button id="back" onclick="nav(-1)">← Back</button><div class="logo">BOOTH<b>IFY</b></div><div id="dots"></div></header><main id="scr"></main></div>
<script>
const $=s=>document.querySelector(s),sl=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORDER=['welcome','layout','theme','filter','camera','enhance','preview','final'];
const LY={classic:{n:4,t:'Classic Photo Strip',d:'4 photos'},triple:{n:3,t:'Triple Photo Strip',d:'3 photos'},grid:{n:4,t:'Photo Grid',d:'2×2 layout'},single:{n:1,t:'Single Portrait',d:'1 photo'}};
const TH={wedding:{t:'Wedding',c:'#FCE4EF',e:'💍',n:'Our Wedding'},birthday:{t:'Birthday',c:'#FFD9D2',e:'🎂',n:'Happy Birthday'},graduation:{t:'Graduation',c:'#E6E1F5',e:'🎓',n:'Class of 2026'},valentine:{t:'Valentine',c:'#FFC2DA',e:'💘',n:'Be My Valentine'},corporate:{t:'Corporate Event',c:'#E3EAF2',e:'🏢',n:'Company Gathering'},custom:{t:'Custom Event',c:'#F5F4F6',e:'✨',n:'My Event'}};
const FL={natural:['Natural','brightness(1)'],vintage:['Vintage','sepia(.5) contrast(.9) saturate(.8)'],warm:['Warm Tone','sepia(.25) saturate(1.35) brightness(1.05)'],bw:['Black &amp; White','grayscale(1) contrast(1.1)'],glow:['Soft Glow','brightness(1.12) contrast(.92) saturate(1.1) blur(.6px)']};
const ENH='brightness(1.06) contrast(1.05) saturate(1.12)';
const S={cur:'welcome',layout:'classic',theme:'wedding',filter:'natural',shots:[],enh:false,name:'Our Wedding',date:new Date().toISOString().slice(0,10),sticker:'💍',color:'#FCE4EF',logo:null,view:null,tab:0};
const fx=()=>FL[S.filter][1]+(S.enh?' '+ENH:'');
let stream=null,MK0=null;
function mock(k){const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d'),h=[330,200,20,270,160][k%5];const g=x.createLinearGradient(0,0,640,480);g.addColorStop(0,`hsl(${h},70%,85%)`);g.addColorStop(1,`hsl(${h+40},70%,70%)`);x.fillStyle=g;x.fillRect(0,0,640,480);
x.fillStyle=`hsl(${h+180},40%,40%)`;x.beginPath();x.ellipse(320,520,190,170,0,0,7);x.fill();x.fillStyle='#e0ac8d';x.fillRect(295,300,50,60);x.beginPath();x.ellipse(320,230,85,105,0,0,7);x.fill();
x.fillStyle='#3a2a28';x.beginPath();x.ellipse(320,175,92,80,0,Math.PI,2*Math.PI);x.fill();x.fillStyle='#242424';[285,355].forEach(a=>{x.beginPath();x.arc(a,225,8,0,7);x.fill()});
x.strokeStyle='#242424';x.lineWidth=5;x.beginPath();x.arc(320,255,38,.2,Math.PI-.2);x.stroke();return c.toDataURL('image/jpeg',.85)}
function strip(w,shots,nf){const n=LY[S.layout].n;let cl='';for(let i=0;i<n;i++){const s=shots&&shots[i];cl+=`<div class="cell">${s?`<img src="${s}" style="filter:${fx()}">`:i+1}</div>`}
const st=S.sticker!=='none'?S.sticker:'';
return `<div class="strip ${S.layout}" style="--w:${w};--fc:${S.color}">${cl}${nf?'':`<div class="ft">${S.logo?`<img src="${S.logo}">`:''}${esc(S.name)}<br><span style="font-weight:600;opacity:.7">${esc(S.date)}</span></div>`}${st?`<span class="stk" style="top:-8px;left:-8px">${st}</span><span class="stk" style="bottom:-8px;right:-8px">${st}</span>`:''}</div>`.replace(/--w:(\d+)/,'--w:$1px')}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function go(n){stopCam();S.cur=n;render()}
const nav=d=>go(ORDER[ORDER.indexOf(S.cur)+d]);
function pick(k,v){S[k]=v;if(k==='layout')S.shots=[];if(k==='theme'){const T=TH[v];S.color=T.c;S.sticker=T.e;if(!S.edited)S.name=T.n}render()}
function render(){const i=ORDER.indexOf(S.cur);$('#dots').innerHTML=ORDER.slice(1).map((_,k)=>`<span class="${k<i?'on':''}"></span>`).join('');$('#back').style.visibility=(i>0&&i<7)?'visible':'hidden';const m=$('#scr');m.style.animation='none';m.offsetHeight;m.style.animation='';m.innerHTML=SC[S.cur]();if(B[S.cur])B[S.cur]()}
const SC={},B={};
SC.welcome=()=>`<svg width="240" viewBox="0 0 220 240" style="margin-top:4px"><circle cx="110" cy="120" r="104" fill="none" stroke="#D6338A" stroke-width="2"/><path d="M110 190v45M110 215l-28 25M110 215l28 25" stroke="#242424" stroke-width="6" fill="none"/><rect x="52" y="30" width="116" height="164" rx="20" fill="#F0EFEE" stroke="#e2e0e0"/><rect x="68" y="48" width="84" height="20" rx="5" fill="#EBD9D0"/><circle cx="110" cy="88" r="5" fill="#242424"/><rect x="64" y="110" width="92" height="44" rx="5" fill="#111"/><text x="110" y="129" text-anchor="middle" fill="#fff" font-weight="900" font-size="12" font-family="Lato,sans-serif">BOOTHIFY</text><text x="110" y="144" text-anchor="middle" fill="#fff" font-weight="900" font-size="10" font-family="Lato,sans-serif">PRESS HERE</text><path d="M82 18h44l6 10H76z" fill="#FF8978"/><rect x="70" y="26" width="68" height="6" rx="3" fill="#FF8978"/></svg>
<h1>READY TO MAKE <em>MEMORIES?</em></h1><p class="sub">Capture your happiest moments with Boothify.</p><button class="btn p big" onclick="nav(1)">START PHOTO SESSION</button>`;
SC.layout=()=>`<h1>CHOOSE YOUR <em>LAYOUT</em></h1><p class="sub">How should your photos look?</p><div class="cards">${Object.entries(LY).map(([k,v])=>`<div class="card ${S.layout===k?'sel':''}" onclick="pick('layout','${k}')">${strip(k==='grid'||k==='single'?90:62,null,1)}<b>${v.t}</b><small>${v.d}</small></div>`).join('')}</div><button class="btn p" onclick="nav(1)">NEXT: THEME</button>`;
SC.theme=()=>`<h1>PICK A <em>THEME</em></h1><div class="row" style="align-items:flex-start;gap:30px;max-width:960px"><div style="flex:1;min-width:300px"><div class="tabs"><button class="tab" id="t0" onclick="tab(0)">Themes</button><button class="tab" id="t1" onclick="tab(1)">Customize</button></div>
<div id="p0" class="g3">${Object.entries(TH).map(([k,v])=>`<div class="card ${S.theme===k?'sel':''}" onclick="pick('theme','${k}')"><div style="width:70px;height:84px;border-radius:10px;background:${v.c};padding:6px;position:relative"><div style="background:#fff;height:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:28px">${v.e}</div></div><b>${v.t}</b></div>`).join('')}</div>
<div id="p1"><label class="fld">Event name<input type="text" id="en" value="${esc(S.name)}" oninput="S.name=this.value;S.edited=1;upd()"></label><label class="fld">Event date<input type="date" id="ed" value="${S.date}" oninput="S.date=this.value;upd()"></label>
<div class="fld">Decorative stickers</div><div class="chips">${['none',TH[S.theme].e,'⭐','🎈','💖','🌸'].map(e=>`<button class="chip ${S.sticker===e?'sel':''}" onclick="chip(this,'sticker','${e}')">${e==='none'?'✕':e}</button>`).join('')}</div>
<div class="fld">Frame color</div><div class="chips">${['#FCE4EF','#FFD9D2','#E6E1F5','#FFC2DA','#E3EAF2','#FFFFFF','#D6338A','#FF8978'].map(c=>`<button class="chip ${S.color===c?'sel':''}" style="background:${c}" onclick="chip(this,'color','${c}')"></button>`).join('')}</div>
<label class="fld">Custom logo<input type="file" accept="image/*" onchange="logo(this)"></label></div></div><div id="pv" style="padding:14px 20px">${strip(170,null)}</div></div><div class="row" style="margin-top:16px"><button class="btn p" onclick="nav(1)">NEXT: FILTER</button></div>`;
B.theme=()=>tab(S.tab);
function tab(k){S.tab=k;$('#p0').style.display=k?'none':'grid';$('#p1').style.display=k?'block':'none';$('#t0').className='tab'+(k?'':' on');$('#t1').className='tab'+(k?' on':'')}
function upd(){$('#pv').innerHTML=strip(170,null)}
function chip(el,k,v){S[k]=v;[...el.parentNode.children].forEach(c=>c.classList.remove('sel'));el.classList.add('sel');upd()}
function logo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;upd()};r.readAsDataURL(f)}
SC.filter=()=>{MK0=MK0||mock(0);return `<h1>CHOOSE YOUR <em>FILTER</em></h1><p class="sub">Tap to compare before you shoot.</p><div class="cards">${Object.entries(FL).map(([k,v])=>`<div class="card ${S.filter===k?'sel':''}" onclick="pick('filter','${k}')"><img src="${MK0}" style="filter:${v[1]}"><b>${v[0]}</b></div>`).join('')}</div><button class="btn p" onclick="nav(1)">NEXT: CAMERA</button>`};
SC.camera=()=>{const n=LY[S.layout].n;if(S.shots.length>=n)S.shots=[];MK0=MK0||mock(0);return `<h1>SMILE, <em>YOU’RE ON!</em></h1><div class="vf"><img id="mk" src="${MK0}" style="filter:${FL[S.filter][1]}"><video id="vid" autoplay playsinline muted style="display:none;filter:${FL[S.filter][1]}"></video><div class="guide"></div><div class="bdg" id="bd">Demo camera</div><div class="cd" id="cd"></div><div class="fl" id="fl"></div></div>
<div class="pg" id="pg"></div><p class="sub" style="margin:0 0 12px;font-size:16px" id="pt">Center your face inside the dotted oval.</p><button class="btn p big" id="go" onclick="run()">START CAPTURE</button>`};
B.camera=()=>{prog();if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).then(s=>{if(S.cur!=='camera'){s.getTracks().forEach(t=>t.stop());return}stream=s;const v=$('#vid');v.srcObject=s;v.style.display='block';$('#mk').style.display='none';$('#bd').textContent='Live camera'}).catch(()=>{})};
function prog(){const n=LY[S.layout].n,k=S.shots.length;$('#pg').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<k?'on':''}"></i>`).join('');$('#pt').textContent=k<n?`Photo ${Math.min(k+1,n)} of ${n} — center your face inside the dotted oval.`:'All done!'}
function snap(){const v=$('#vid');if(v&&v.style.display!=='none'&&v.videoWidth){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0);return c.toDataURL('image/jpeg',.9)}return mock(S.shots.length+1)}
async function run(){const n=LY[S.layout].n;$('#go').disabled=true;while(S.shots.length<n){for(let i=3;i>0;i--){if(S.cur!=='camera')return;$('#cd').textContent=i;await sl(1000)}if(S.cur!=='camera')return;$('#cd').textContent='';$('#fl').classList.remove('on');$('#fl').offsetHeight;$('#fl').classList.add('on');S.shots.push(snap());prog();await sl(1000)}if(S.cur==='camera')go('enhance')}
let en=false,done=false;
SC.enhance=()=>{en=false;done=false;const a=S.shots[0];return `<h1>AI AUTO <em>ENHANCE</em></h1><div class="ba"><img src="${a}" style="filter:${FL[S.filter][1]}"><img id="af" src="${a}" style="filter:${FL[S.filter][1]} ${ENH} blur(.4px);clip-path:inset(0 0 0 50%);display:none"><span class="lb" style="left:10px">BEFORE</span><span class="lb" id="al" style="right:10px;display:none">AFTER</span><div class="ld" id="ld" style="display:none"><div class="sp"></div>AI is enhancing your photo...</div></div>
<input type="range" id="rg" min="0" max="100" value="50" style="width:min(100%,520px);margin:10px 0;display:none;accent-color:#D6338A" oninput="$('#af').style.clipPath='inset(0 0 0 '+this.value+'%)'">
<div class="row" style="margin:6px 0"><b>Enable AI Enhancement</b><div class="sw" id="sw" onclick="tog()"></div></div>
<div class="ft2"><span class="pill">✨ AI Skin Retouch</span><span class="pill">💡 AI Lighting Correction</span><span class="pill">🎨 AI Color Enhancement</span></div>
<p class="note">Prototype: this is a visual simulation, no real AI processing service is connected. A real version should keep faces natural and never reshape them.</p>
<div class="row"><button class="btn o" onclick="S.enh=false;go('preview')">KEEP ORIGINAL</button><button class="btn p" id="ap" disabled onclick="S.enh=true;go('preview')">APPLY ENHANCEMENT</button></div>`};
async function tog(){en=!en;$('#sw').classList.toggle('on',en);$('#ap').disabled=true;if(!en){['af','rg','al'].forEach(i=>$('#'+i).style.display='none');return}$('#ld').style.display='flex';await sl(1800);if(!en||S.cur!=='enhance')return;$('#ld').style.display='none';$('#af').style.display='block';$('#al').style.display='block';$('#rg').style.display='block';$('#ap').disabled=false}
SC.preview=()=>{const n=LY[S.layout].n;const v=S.view;return `<h1>HOW DO YOU <em>LOOK?</em></h1>${v===null?strip(S.layout==='classic'||S.layout==='triple'?190:300,S.shots):`<div class="row"><button class="btn o" onclick="S.view=(S.view+${n-1})%${n};render()">‹</button><div class="ba" style="width:min(70vw,420px)"><img src="${S.shots[v]}" style="filter:${fx()}"></div><button class="btn o" onclick="S.view=(S.view+1)%${n};render()">›</button></div><p class="sub" style="margin-top:8px">Photo ${v+1} of ${n}</p>`}
<div class="row" style="margin-top:18px"><button class="btn o" onclick="S.view=null;S.shots=[];go('camera')">RETAKE</button><button class="btn o" onclick="S.view=S.view===null?0:null;render()">${v===null?'VIEW ONE BY ONE':'VIEW FULL STRIP'}</button><button class="btn p" onclick="S.view=null;nav(1)">CONTINUE</button></div>`};
function qr(){let r=7,s='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const f=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);let on;if(f){const a=x<7?x:x-18,b=y<7?y:y-18;on=a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)}else{r=(r*1103515245+12345)&0x7fffffff;on=(r>>8)%2==0}if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="-1 -1 27 27" width="150" height="150" fill="#242424" style="background:#fff;border-radius:14px;padding:6px">${s}</svg>`}
SC.final=()=>`<h1>YOUR MEMORIES <em>ARE READY!</em></h1><div class="row" style="gap:36px;margin-top:6px">${strip(S.layout==='classic'||S.layout==='triple'?170:270,S.shots)}<div style="display:flex;flex-direction:column;align-items:center;gap:12px"><button class="btn p big" id="pr" onclick="prt()">PRINT PHOTO</button><div style="text-align:center">${qr()}<div class="note" style="margin:2px">Scan for digital photos (demo QR)<br>boothify.demo/gallery/A7K2Q9</div></div>
<div><div class="st" id="s0"><i>•</i>Uploading Photos</div><div class="st" id="s1"><i>•</i>Upload Completed</div><div class="st" id="s2"><i>•</i>Digital Photos Ready</div></div></div></div>
<p class="note">Your photos are automatically uploaded to your event organizer’s Google Drive.<br>(Prototype simulation, Google Drive is not connected.)</p><button class="btn o" onclick="Object.assign(S,{shots:[],enh:false,view:null});go('welcome')">START NEW SESSION</button>`;
B.final=async()=>{for(let i=0;i<3;i++){if(S.cur!=='final')return;$('#s'+i).className='st act';$('#s'+i).firstChild.textContent='…';await sl(1500);if(S.cur!=='final')return;$('#s'+i).className='st done';$('#s'+i).firstChild.textContent='✓'}}
async function prt(){const b=$('#pr');b.disabled=true;b.textContent='PRINTING...';await sl(2500);b.textContent='PRINTED ✓ (SIMULATED)';await sl(1500);b.disabled=false;b.textContent='PRINT AGAIN'}
render();
</script></body></html>
